name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint + types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src/app tests

      - name: Ruff (format check)
        run: ruff format --check src/app tests

      - name: Mypy (hard gate)
        run: mypy

      - name: Tests + coverage
        env:
          ENVIRONMENT: test
        # Release gate: line coverage >= 80% (see pyproject.toml).
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-32
      DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Upgrade head
        run: alembic upgrade head
      - name: Downgrade base (rollback safety)
        run: alembic downgrade base

  image:
    name: Build and publish image
    needs: [quality, migrations]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.owner }}/xianxiaobao-fastapi:${{ github.sha }}
            ghcr.io/${{ env.owner }}/xianxiaobao-fastapi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
