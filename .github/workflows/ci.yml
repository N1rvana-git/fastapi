name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 🌟 赋予机器人往车库写数据的权限
    permissions:
      contents: read
      packages: write
    # ==========================================
    # 🌟 云端临时车间：给机器人配一台免费的 Redis
    # ==========================================
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 第一步：检出代码
      uses: actions/checkout@v3

    - name: 🐍 第二步：配置 Python 3.11 环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 📦 第三步：安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx flake8

    - name: 🕵️‍♂️ 第四步：代码审查 (Linting)
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    # ==========================================
    # 🌟 第五步：实弹演习！通过环境变量指挥代码连 localhost
    # ==========================================
    - name: 🧪 第五步：执行自动化测试 (Pytest)
      env:
        REDIS_URL: "redis://localhost:6379/0"
        REDIS_HOST: "localhost" # 👈 告诉我们的 FastAPI 保安，去 localhost 找 Redis！
      run: |
        pytest tests/ -v

        # ==========================================
    # 🌟 第六步：进入 CD (持续部署) 阶段！
    # ==========================================
    - name: 🔐 登录 GitHub 官方镜像车库 (GHCR)
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        # 机器人拿你的名字作为账号
        username: ${{ github.actor }} 
        # 机器人使用 GitHub 自动颁发的临时通行证，不需要你填密码！
        password: ${{ secrets.GITHUB_TOKEN }} 

    - name: 🐳 自动化构建并入库 (Build and Push)
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true # 构建完立刻推送到车库！
        # 给集装箱贴上你的专属名字，注意全部要是小写！
        tags: ghcr.io/${{ github.repository_owner }}/xianxiaobao-fastapi:latest