name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # ==========================================
    # 🌟 云端临时车间：给机器人配一台免费的 Redis
    # ==========================================
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 第一步：检出代码
      uses: actions/checkout@v3

    - name: 🐍 第二步：配置 Python 3.11 环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 📦 第三步：安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx flake8

    - name: 🕵️‍♂️ 第四步：代码审查 (Linting)
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    # ==========================================
    # 🌟 第五步：实弹演习！通过环境变量指挥代码连 localhost
    # ==========================================
    - name: 🧪 第五步：执行自动化测试 (Pytest)
      env:
        REDIS_URL: "redis://localhost:6379/0"
        REDIS_HOST: "localhost" # 👈 告诉我们的 FastAPI 保安，去 localhost 找 Redis！
      run: |
        pytest tests/ -v
