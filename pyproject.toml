[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "xianxiaobao-fastapi"
version = "0.2.0"
description = "闲小宝二手交易平台 - FastAPI 工业级后端（模块化单体 + 异步 LLM/SSE + 可观测性）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.109,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "email-validator>=2.1,<3.0",
  "SQLAlchemy[asyncio]>=2.0.25,<3.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.19,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<8.0",
  "httpx>=0.26,<1.0",
  "PyJWT>=2.8,<3.0",
  "passlib>=1.7.4,<2.0",
  "bcrypt>=3.2,<5.0",
  "python-multipart>=0.0.9",
  "cryptography>=42,<47",
  "pgvector>=0.2.5,<1.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
# Heavy, optional capabilities. Install with `pip install -e ".[ai]"`.
ai = [
  "torch>=2.1",
  "transformers>=4.40",
  "pillow>=10.0",
  "playwright>=1.40",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "httpx>=0.26",
]

[project.urls]
Documentation = "https://github.com/your-org/xianxiaobao-fastapi/blob/main/docs/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
# The top-level import package is literally named `src` (historical layout).
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Legacy packages are quarantined (see MIGRATION.md) and excluded from linting.
extend-exclude = [
  "src/posts",
  "src/users",
  "src/auth",
  "src/feishu",
  "health",
  ".venv",
  "alembic/versions/c924f1debfb5_init_schema_with_image_embedding.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
  "B008",   # FastAPI dependencies legitimately live in argument defaults
  "E501",   # line length is handled by the formatter
  "RUF001", # ambiguous unicode punctuation: Chinese copy is intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/app/modules/chat/prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src/app"]
exclude = '^(src/(posts|users|auth|feishu)/|health/)'
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "pgvector.*",
  "redis.*",
  "aiosqlite.*",
  "asyncpg.*",
  "torch.*",
  "transformers.*",
  "playwright.*",
  "passlib.*",
  "jwt.*",
  "langgraph.*",
  "langchain_core.*",
  "prometheus_client.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["src/app/modules/chat/scraper.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
